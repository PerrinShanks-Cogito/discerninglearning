name: NCC explore (temporary)
on:
  push:
    branches: ["claude/ncc-explore"]
    paths: [".github/workflows/ncc-explore.yml", "explore/explore.py"]
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl pandas requests beautifulsoup4
      - run: python explore/explore.py > explore/output.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add explore/output.txt
          git commit -m "Explore output [skip ci]" || true
          git push

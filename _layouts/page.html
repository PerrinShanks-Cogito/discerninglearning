---
layout: default
---
<article class="page wrap">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose{% if page.wide %} prose--wide{% endif %}">
    {{ content }}
  </div>
</article>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      {{ site.title }}<span class="site-title__by">Leaning into improvement, lean and six sigma</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        <li><a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <div class="site-tools">
      <form class="site-search" action="{{ '/search/' | relative_url }}" method="get" role="search">
        <label class="visually-hidden" for="site-search-q">Search this site</label>
        <input id="site-search-q" type="search" name="q" placeholder="Search" autocomplete="off">
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </form>
      {% if site.linkedin %}
      <a class="social-link" href="{{ site.linkedin }}" rel="me noopener" target="_blank" aria-label="{{ site.author }} on LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
      </a>
      {% endif %}
    </div>
  </div>
</header>

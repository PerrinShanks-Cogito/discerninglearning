<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <img src="{{ '/favicon.svg' | relative_url }}" alt="" width="32" height="32">
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        <li><a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <div class="site-tools">
      {%- comment -%} Without JavaScript the search icon just opens the search page. {%- endcomment %}
      <a class="icon-button search-toggle" href="{{ '/search/' | relative_url }}" aria-label="Search" aria-controls="site-search" aria-expanded="false" title="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
      {% if site.linkedin %}
      <a class="icon-button" href="{{ site.linkedin }}" rel="me noopener" target="_blank" aria-label="{{ site.author }} on LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="4"/><path d="M7.5 10.5v6M11.5 16.5v-6M11.5 13.5a3 3 0 0 1 6 0v3"/><circle cx="7.5" cy="7.25" r="1.1" fill="currentColor" stroke="none"/></svg>
      </a>
      {% endif %}
    </div>
    <form class="site-search" id="site-search" action="{{ '/search/' | relative_url }}" method="get" role="search" hidden>
      <label class="visually-hidden" for="site-search-q">Search this site</label>
      <input id="site-search-q" type="search" name="q" placeholder="Search pages and posts" autocomplete="off">
      <button class="button" type="submit">Search</button>
    </form>
  </div>
</header>
<script>
  (function () {
    var toggle = document.querySelector(".search-toggle");
    var form = document.getElementById("site-search");
    var input = document.getElementById("site-search-q");
    function setOpen(open) {
      form.hidden = !open;
      toggle.setAttribute("aria-expanded", open);
      if (open) input.focus();
    }
    toggle.addEventListener("click", function (e) {
      e.preventDefault();
      setOpen(form.hidden);
    });
    form.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { setOpen(false); toggle.focus(); }
    });
  })();
</script>

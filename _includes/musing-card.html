<article class="card">
  <p class="card__meta">
    <time datetime="{{ include.post.date }}">{{ include.post.date | date: '%-d %B %Y' }}</time>
    {% if include.post.categories.size > 0 %}&middot; {{ include.post.categories | join: ', ' | capitalize }}{% endif %}
  </p>
  <h3 class="card__title"><a href="{{ site.musings_base_url }}{{ include.post.url }}">{{ include.post.title }}</a></h3>
  <p>{{ include.post.excerpt }}</p>
</article>

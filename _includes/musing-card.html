<article class="card">
  <p class="card__meta">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%-d %B %Y' }}</time>
    {% if include.post.categories.size > 0 %}&middot; {{ include.post.categories | join: ', ' }}{% endif %}
  </p>
  <h3 class="card__title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  <p>{{ include.post.excerpt | strip_html }}</p>
</article>

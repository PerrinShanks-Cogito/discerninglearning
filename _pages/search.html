---
title: Search
permalink: /search/
search: false
sitemap: false
---
<form class="search-page__form" action="{{ '/search/' | relative_url }}" method="get" role="search">
  <label class="visually-hidden" for="search-page-q">Search this site</label>
  <input id="search-page-q" type="search" name="q" placeholder="Search pages and posts">
  <button class="button" type="submit">Search</button>
</form>
<p id="search-status" class="search-status" aria-live="polite"></p>
<ol id="search-results" class="search-results"></ol>
<noscript><p>Search needs JavaScript. You can browse <a href="{{ '/blog/' | relative_url }}">all posts</a> instead.</p></noscript>
<script src="{{ '/assets/js/search.js' | relative_url }}" data-index="{{ '/search.json' | relative_url }}" defer></script>
